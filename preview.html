<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>物件圖鑑 — Roll Formosa</title>
  <meta name="description" content="搖滾·福爾摩沙 物件圖鑑 — 看看每座城市裡有哪些可以滾的物件。" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <!-- Self-hosted fonts (was Google Fonts CDN, which is cross-origin → the SW
       can't cache it → re-downloaded every visit + broken offline). The gallery
       shows object names = lots of CJK, so it preloads the full Noto subset
       directly (no UI split here, to avoid a second unicode-range to keep in
       sync). Both files are SW-precached. Regenerate via scripts/gen-fonts.sh. -->
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/bungee.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/notosanstc.woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Bungee';
      src: url('/assets/fonts/bungee.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Noto Sans TC';
      src: url('/assets/fonts/notosanstc.woff2') format('woff2');
      font-weight: 100 900; font-style: normal; font-display: swap;
    }
  </style>
  <style>
    :root {
      --c-cyan: #00e0ff; --c-pink: #ff2a78; --c-gold: #ffd86b;
      --c-green: #8fe0a0; --c-blue: #9db4d8; --c-bg: #0b0b16;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--c-bg); overflow: hidden;
      font-family: "Noto Sans TC", system-ui, sans-serif; color: #e6ecff;
      -webkit-tap-highlight-color: transparent; }
    canvas { display: block; }

    /* ---- top chrome ---- */
    #sc-top { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0));
      padding-left: calc(16px + env(safe-area-inset-left, 0));
      background: linear-gradient(#0b0b16ee, #0b0b1600); pointer-events: none; }
    #sc-top > * { pointer-events: auto; }
    #sc-back { text-decoration: none; color: #cdd6ee; font-size: 14px; font-weight: 700;
      padding: 7px 14px; border-radius: 999px; letter-spacing: .04em;
      border: 1px solid #ffffff22; background: #ffffff0d; white-space: nowrap; }
    #sc-back:hover { border-color: var(--c-cyan); color: #fff; box-shadow: 0 0 16px #00e0ff55; }
    #sc-title-wrap { display: flex; flex-direction: column; line-height: 1.15; }
    #sc-kicker { font-family: "Bungee", sans-serif; font-size: 13px; letter-spacing: .14em;
      color: var(--c-cyan); text-shadow: 0 0 12px #00e0ff77; }
    #sc-header { font-size: 12px; color: #9fb0d0; letter-spacing: .03em; margin-top: 2px; }
    #sc-header b { color: #fff; }
    #sc-header .sc-scale { color: var(--c-gold); }

    /* ---- city switcher pills ---- */
    #sc-cities { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
    .sc-pill { font-family: inherit; font-size: 14px; font-weight: 700; color: #cdd6ee;
      padding: 7px 16px; border-radius: 999px; cursor: pointer; letter-spacing: .04em;
      border: 1px solid #ffffff22; background: #ffffff0d; transition: all .15s; white-space: nowrap; }
    .sc-pill:hover { border-color: var(--c-pink); color: #fff; }
    .sc-pill.active { color: #0b0b16; background: var(--c-pink); border-color: var(--c-pink);
      box-shadow: 0 0 20px #ff2a7866; }
    .sc-pill.soon { opacity: .55; }
    .sc-pill.soon::after { content: " · 即將推出"; font-size: 11px; opacity: .8; }

    /* ---- per-object label ---- */
    .lbl { color: #e6ecff; font-size: 12px; text-align: center; white-space: nowrap;
      text-shadow: 0 1px 3px #000, 0 0 6px #000; pointer-events: none; user-select: none; }
    .lbl.kind-monument { color: var(--c-gold); }
    .lbl.kind-landmark { color: var(--c-green); }
    .lbl.kind-collectible { color: var(--c-pink); }
    .lbl.kind-chunk { color: var(--c-blue); }

    /* ---- section band header ---- */
    .sc-band { white-space: nowrap; pointer-events: none; user-select: none;
      font-weight: 900; font-size: 16px; letter-spacing: .04em;
      text-shadow: 0 1px 4px #000, 0 0 10px #000; }
    .sc-band .n { font-size: 12px; font-weight: 700; margin-left: 8px; opacity: .8;
      padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
    .sc-band.kind-monument { color: var(--c-gold); }
    .sc-band.kind-landmark { color: var(--c-green); }
    .sc-band.kind-collectible { color: var(--c-pink); }
    .sc-band.kind-chunk { color: var(--c-blue); }

    /* ---- scroll hint ---- */
    #sc-hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 15; font-size: 12px; color: #8aa0c8; letter-spacing: .06em; pointer-events: none;
      background: #0b0b1699; padding: 6px 14px; border-radius: 999px; border: 1px solid #ffffff14;
      transition: opacity .4s; }

    /* ---- focus overlay ---- */
    #sc-focus { position: fixed; inset: 0; z-index: 30; display: flex;
      align-items: flex-end; justify-content: center; pointer-events: none; }
    #sc-focus.hidden { display: none; }
    #sc-focus-card { pointer-events: auto; margin-bottom: 6vh; text-align: center;
      background: #11111fdd; border: 1px solid #ffffff1f; border-radius: 16px;
      padding: 14px 26px; backdrop-filter: blur(6px); box-shadow: 0 10px 40px #000a; }
    #sc-focus-name { font-family: "Bungee", "Noto Sans TC", sans-serif; font-size: 22px;
      color: #fff; letter-spacing: .03em; }
    #sc-focus-meta { font-size: 13px; color: #9fb0d0; margin-top: 4px; letter-spacing: .04em; }
    #sc-focus-close { margin-top: 12px; font-family: inherit; font-size: 13px; font-weight: 700;
      color: #cdd6ee; cursor: pointer; padding: 6px 18px; border-radius: 999px;
      border: 1px solid #ffffff22; background: #ffffff0d; }
    #sc-focus-close:hover { border-color: var(--c-cyan); color: #fff; }

    @media (max-width: 600px) {
      #sc-top { gap: 6px 8px; padding: 8px 10px; }
      #sc-kicker { font-size: 11px; } #sc-header { font-size: 11px; }
      /* pills drop to their own full-width centred row so they're never pushed off-screen */
      #sc-cities { margin-left: 0; width: 100%; justify-content: center; }
      .sc-pill { font-size: 13px; padding: 6px 14px; }
      .sc-band { font-size: 14px; } .lbl { font-size: 11px; }
      #sc-hint { font-size: 11px; bottom: 10px; }
      #sc-focus-card { padding: 12px 20px; } #sc-focus-name { font-size: 19px; }
    }
  </style>
</head>
<body>
  <!-- 物件圖鑑 (Object Showcase): a player-facing, sectioned 3D catalogue of EVERY
       object in ?city=<id> — goal monument + landmarks + collectibles + the 70 chunk
       street objects (grouped by tier). City switcher (in-page, no reload), header
       with count + scale, click an object to focus it. Reached from the title-screen
       「物件圖鑑」 button. Dev affordances kept: ?kind=<kind> narrows, ?item=<id> close-up.
       Built as a 2nd Vite entry, so it ships to GitHub Pages alongside the game. -->
  <div id="sc-top">
    <a id="sc-back" href="./index.html">← 返回</a>
    <div id="sc-title-wrap">
      <span id="sc-kicker">物件圖鑑</span>
      <span id="sc-header">載入中…</span>
    </div>
    <div id="sc-cities"></div>
  </div>

  <div id="sc-hint">滾動 / 拖曳瀏覽 · 點物件放大</div>

  <div id="sc-focus" class="hidden">
    <div id="sc-focus-card">
      <div id="sc-focus-name"></div>
      <div id="sc-focus-meta"></div>
      <button id="sc-focus-close" type="button">關閉 / CLOSE</button>
    </div>
  </div>

  <script type="module" src="/src/preview.js"></script>
  <!-- Register the SW here too, so opening preview.html directly (not via the
       title screen) still installs the offline cache. Same scope ('./') as
       index.html — if the SW is already registered this is a no-op. -->
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
