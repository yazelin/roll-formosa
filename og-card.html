<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  #card {
    position:relative; width:1200px; height:630px;
    font-family:'Noto Sans TC','Avenir Next',system-ui,sans-serif;
    background:
      radial-gradient(60% 75% at 50% 26%, rgba(120,30,90,.55) 0%, rgba(60,20,70,.18) 42%, rgba(0,0,0,0) 70%),
      linear-gradient(180deg, #0b0c14 0%, #131630 55%, #1c1438 100%);
    overflow:hidden;
  }
  /* skyline backdrop (multi-city), full width, behind everything */
  .sky { position:absolute; left:0; bottom:-6px; width:100%; z-index:0; opacity:.98; filter:drop-shadow(0 0 8px rgba(0,210,255,.32)); }
  .skyglow { position:absolute; left:0; bottom:-6px; width:100%; z-index:0; filter:blur(9px) brightness(1.5); opacity:.55; }
  .scrim { position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(11,12,20,.0) 38%, rgba(11,12,20,.30) 70%, rgba(11,12,20,.55) 100%); }
  /* lanterns */
  .lan { position:absolute; z-index:2; width:34px; height:46px; border-radius:50%/42%;
    background:radial-gradient(circle at 38% 32%, #ff8a6a, #d83a2c 70%); box-shadow:0 0 18px rgba(232,58,44,.7); }
  .lan::before{ content:''; position:absolute; left:50%; top:-34px; width:1px; height:34px; background:rgba(255,180,120,.5); transform:translateX(-50%); }
  .lan::after{ content:''; position:absolute; left:50%; bottom:-6px; width:5px; height:8px; background:#f5c542; transform:translateX(-50%); border-radius:2px; }
  /* floating neon words */
  .w { position:absolute; z-index:2; font-weight:900; font-size:30px; opacity:.92; }
  /* center column */
  .mid { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; }
  .kicker { margin-top:30px; font-family:'Bungee',sans-serif; font-size:17px; letter-spacing:.42em; padding-left:.42em;
    color:#7ef3ff; text-shadow:0 0 8px #00e0ff,0 0 20px #00b3ff; }
  .title { font-family:'Bungee',sans-serif; font-weight:400; font-size:122px; line-height:.9; letter-spacing:.01em; color:#fff;
    text-align:center; margin-top:8px;
    text-shadow:0 0 4px #fff,0 0 14px #ff2a78,0 0 30px #ff2a78,0 0 60px #ff2a78,0 0 92px rgba(255,42,120,.55); }
  .sub { margin-top:20px; font-size:30px; font-weight:700; color:#e6ecff; text-shadow:0 0 12px rgba(0,190,255,.35),0 2px 6px rgba(0,0,0,.6); }
  .sub em{ font-style:italic; color:#cfe0ff; }
  .start { margin-top:20px; font-family:'Noto Sans TC',sans-serif; font-weight:900; font-size:30px; letter-spacing:.04em; color:#1b0418;
    padding:15px 56px; border-radius:40px; background:linear-gradient(180deg,#ff6fac,#ff2a78);
    box-shadow:0 0 0 2px rgba(255,255,255,.3) inset,0 0 26px rgba(255,42,120,.8),0 10px 34px rgba(255,42,120,.5); }
  .pill { margin-top:16px; display:inline-flex; align-items:center; gap:9px; font-weight:700; font-size:18px; color:#dff6ff;
    padding:7px 18px 7px 9px; border-radius:30px; background:rgba(8,4,22,.6); border:1px solid rgba(0,221,255,.55); box-shadow:0 0 14px rgba(0,221,255,.3); }
  .pill .ball{ width:26px; height:26px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 2px #00e0ff,0 0 12px rgba(0,224,255,.7); }
</style>
</head>
<body>
<div id="card">
  <img class="skyglow" src="/assets/og-skyline.webp" />
  <img class="sky" src="/assets/og-skyline.webp" />
  <div class="scrim"></div>

  <div class="lan" style="top:14px; left:130px;"></div>
  <div class="lan" style="top:6px; left:360px; width:30px; height:40px;"></div>
  <div class="lan" style="top:18px; right:360px; width:30px; height:40px;"></div>
  <div class="lan" style="top:8px; right:140px;"></div>

  <span class="w" style="top:88px; left:64px; color:#ff5ea0; text-shadow:0 0 12px #ff2a78; transform:rotate(-8deg);">小吃</span>
  <span class="w" style="top:62px; right:300px; color:#ffd36a; text-shadow:0 0 12px #ffae3b; transform:rotate(5deg);">珍奶</span>
  <span class="w" style="top:128px; right:58px; color:#5fe6ff; text-shadow:0 0 12px #00e0ff; transform:rotate(7deg);">夜市</span>
  <span class="w" style="top:210px; right:70px; color:#ffd36a; text-shadow:0 0 12px #ffae3b; transform:rotate(-4deg);">雞排</span>
  <span class="w" style="top:262px; left:78px; color:#ffb04a; text-shadow:0 0 12px #ff8a2b; transform:rotate(4deg);">滷味</span>

  <div class="mid">
    <div class="kicker">夜市 · NIGHT MARKET</div>
    <div class="title">ROLL<br>FORMOSA</div>
    <div class="sub">捲啊捲，捲遍全台灣。 <em>Roll up all of Formosa.</em></div>
    <div class="start">開始 / START</div>
    <div class="pill"><img class="ball" src="/assets/donack/idle-0.webp" />月牙·導遊 ON</div>
  </div>
</div>
</body>
</html>
